<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Projeto | TejiCriativo</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        #viewer-3d {
            width: 100%;
            height: 500px;
            background: #1a1a20;
            border-radius: 24px;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }
        .action-buttons {
            display: flex;
            gap: 1rem;
        }
        .comment-section {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .comment-card {
            background: rgba(255,255,255,0.03);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="TejiCriativo Logo">
            <span>TejiCriativo</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Explorar</a>
            <a href="upload.html">Upload</a>
            <div id="auth-links"></div>
        </div>
    </nav>

    <main class="container">
        <div id="project-content">
            <div class="loader-container" style="text-align: center; padding: 5rem;">
                <span class="loader"></span>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
