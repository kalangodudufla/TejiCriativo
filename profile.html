<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | TejiCriativo</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="TejiCriativo Logo">
            <span>TejiCriativo</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Explorar</a>
            <a href="upload.html">Upload</a>
            <button id="logout-btn" class="btn-outline" style="background: transparent; cursor: pointer;">Sair</button>
        </div>
    </nav>

    <main class="container">
        <div class="profile-header" style="text-align: center; margin-bottom: 4rem; padding: 3rem; background: var(--card-bg); border-radius: 24px;">
            <div id="profile-avatar" style="width: 100px; height: 100px; background: var(--purple); border-radius: 50%; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800;">U</div>
            <h2 id="profile-name">Carregando...</h2>
            <p id="profile-email" style="color: var(--text-gray);"></p>
        </div>

        <h3>Meus Projetos</h3>
        <div class="project-grid" id="user-projects">
            <!-- Projetos do usuário serão carregados aqui -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
