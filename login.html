<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TejiCriativo</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="TejiCriativo Logo">
            <span>TejiCriativo</span>
        </a>
    </nav>

    <div class="form-container">
        <h2 id="auth-title" style="margin-bottom: 2rem; text-align: center;">Bem-vindo de volta</h2>
        
        <form id="auth-form">
            <div class="form-group" id="name-group" style="display: none;">
                <label for="reg-name">Nome Completo</label>
                <input type="text" id="reg-name" placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label for="auth-email">E-mail</label>
                <input type="email" id="auth-email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="auth-password">Senha</label>
                <input type="password" id="auth-password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="auth-btn" class="btn-primary" style="width: 100%; margin-top: 1rem;">Entrar</button>
        </form>

        <p style="margin-top: 2rem; text-align: center; color: var(--text-gray);">
            <span id="toggle-text">Não tem uma conta?</span> 
            <a href="#" id="toggle-auth" style="color: var(--neon-green); font-weight: 600;">Criar conta</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
